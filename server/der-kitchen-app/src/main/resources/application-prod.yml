spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME:der_kitchen}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  flyway:
    placeholders:
      admin_openid: ${ADMIN_OPENID}
      admin_username: ${ADMIN_USERNAME:admin}
      admin_password_hash: ${ADMIN_PASSWORD_HASH}
      user_openid: ${WIFE_OPENID}

minio:
  endpoint: ${MINIO_ENDPOINT}
  access-key: ${MINIO_ACCESS_KEY}
  secret-key: ${MINIO_SECRET_KEY}
  bucket: ${MINIO_BUCKET}

app:
  wx:
    app-id: ${WX_APP_ID}
    app-secret: ${WX_APP_SECRET}
    subscribe:
      enabled: ${WX_SUBSCRIBE_ENABLED:false}
      template-id: ${WX_SUBSCRIBE_TEMPLATE_ID:}
      page: ${WX_SUBSCRIBE_PAGE:pages/order/detail?id={orderId}}
      meal-key: ${WX_SUBSCRIBE_MEAL_KEY:thing1}
      summary-key: ${WX_SUBSCRIBE_SUMMARY_KEY:thing2}
      time-key: ${WX_SUBSCRIBE_TIME_KEY:time3}
      max-attempts: ${WX_SUBSCRIBE_MAX_ATTEMPTS:5}
      retry-base-seconds: ${WX_SUBSCRIBE_RETRY_BASE_SECONDS:30}
      processing-timeout-seconds: ${WX_SUBSCRIBE_PROCESSING_TIMEOUT_SECONDS:300}
      worker-delay-millis: ${WX_SUBSCRIBE_WORKER_DELAY_MILLIS:3000}
  auth:
    allowed-openids:
      - ${WIFE_OPENID}
      - ${ADMIN_OPENID}
    admin-openids:
      - ${ADMIN_OPENID}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

knife4j:
  enable: false

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

logging:
  level:
    root: info
    com.der.kitchen: info
    org.springframework.web: warn
  file:
    name: ${LOG_FILE:logs/der-kitchen.log}
  logback:
    rollingpolicy:
      max-file-size: 50MB
      max-history: 30
      total-size-cap: 1GB
